org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
android.useAndroidX=true

# GROUP is what the publish plugin reads. `group` is the Gradle project group, set here so
# it does not depend on the machine: Kotlin derives the module name from it and the Compose
# compiler bakes that name into generated declarations, so a build on a workstation that
# sets group in ~/.gradle/gradle.properties would otherwise disagree with CI, which falls
# back to the root project name. RELEASING.md allows publishing from either.
group=com.seanproctor
GROUP=com.seanproctor
VERSION_NAME=0.3.0

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/sproctor/compose-docking
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/sproctor/compose-docking
POM_SCM_CONNECTION=scm:git:git://github.com/sproctor/compose-docking.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/sproctor/compose-docking.git
POM_DEVELOPER_ID=sproctor
POM_DEVELOPER_NAME=Sean Proctor
POM_DEVELOPER_URL=https://github.com/sproctor

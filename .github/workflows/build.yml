name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Held at v5 deliberately: v6 moves caching into gradle-actions-caching, which is
      # proprietary and carries Gradle's Terms of Use. v5 is the newest fully-MIT release.
      - uses: gradle/actions/setup-gradle@v5
      - name: ABI check and JVM tests
        run: ./gradlew checkKotlinAbi :docking-core:jvmTest :docking-material3:assemble :docking-jewel:assemble

  full-build:
    # macOS compiles/links the iOS klibs as well.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Held at v5 deliberately: v6 moves caching into gradle-actions-caching, which is
      # proprietary and carries Gradle's Terms of Use. v5 is the newest fully-MIT release.
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble all targets
        run: ./gradlew assemble

name: Build

on:
  push:
    branches: [main]
  pull_request:

# A branch only needs its newest commit checked, so a push supersedes whatever was still
# running for the same ref. Pushes to main are left alone: every commit there gets its own
# run, and cancelling one would leave a gap in the history of what was green.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Everything that is not Apple. Kotlin/Native's iOS targets are *disabled* on a Linux
    # host rather than failing on it - the tasks report success without producing a klib -
    # so nothing here says anything about iOS, and the job below is what covers it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # v6 defaults cache-provider to 'enhanced', the commercial gradle-actions-caching
      # component; 'basic' is the open-source implementation over the GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: ABI check, JVM tests, and every non-Apple target
        run: ./gradlew checkKotlinAbi :docking-core:jvmTest assemble

  ios:
    # Only the part that actually needs a Mac. This used to run a full `assemble`, which
    # rebuilt the JVM, Android, wasm and demo targets the Linux job had already covered -
    # on the runner that bills at ten times the rate, and it was the slowest thing in the
    # pipeline by several minutes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # See above: 'basic' keeps caching on the open-source implementation.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # setup-gradle caches the Gradle user home, which is not where the Kotlin/Native
      # compiler and its platform libraries land, so without this they are fetched again
      # on every run. The Kotlin version is what decides which distribution is wanted.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Compile the iOS klibs
        run: ./gradlew iosArm64MainKlibrary iosSimulatorArm64MainKlibrary

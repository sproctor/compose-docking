name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ABI check and JVM tests
        run: ./gradlew checkKotlinAbi :docking-core:jvmTest :docking-material3:assemble :docking-jewel:assemble

  full-build:
    # macOS compiles/links the iOS klibs as well.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble all targets
        run: ./gradlew assemble

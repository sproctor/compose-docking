name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # v6 defaults cache-provider to 'enhanced', the commercial gradle-actions-caching
      # component; 'basic' is the open-source implementation over the GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: ABI check and JVM tests
        run: ./gradlew checkKotlinAbi :docking-core:jvmTest :docking-material3:assemble :docking-jewel:assemble

  full-build:
    # macOS compiles/links the iOS klibs as well.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # v6 defaults cache-provider to 'enhanced', the commercial gradle-actions-caching
      # component; 'basic' is the open-source implementation over the GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Assemble all targets
        run: ./gradlew assemble

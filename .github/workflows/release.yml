name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # macOS is the only runner that can compile the iOS klibs, and a Central deployment
    # has to carry every target of a multiplatform module at once - a partial upload is
    # rejected. The same image supplies the Android SDK the android target needs.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # See build.yml: 'basic' keeps caching on the open-source implementation.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check the tag matches VERSION_NAME
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION_NAME=$version"
            exit 1
          fi
          echo "Releasing $version"

      - name: Test
        run: ./gradlew :docking-core:jvmTest

      # Central publishes are immutable, so this runs last: it uploads every target as
      # one deployment and releases it only if Central's validation passes.
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
